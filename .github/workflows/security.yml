name: Security

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@cargo-audit
      - name: Verify the temporary RSA advisory exception is inactive
        working-directory: backend-rust
        run: |
          if cargo tree --locked --target all -i rsa@0.9.10 | grep -q 'rsa v0.9.10'; then
            echo 'RUSTSEC-2023-0071 is active in the selected dependency graph.' >&2
            exit 1
          fi
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
        working-directory: backend-rust
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks tree and history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --config=/repo/.gitleaks.toml --redact --no-banner --no-color
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config=/repo/.gitleaks.toml --redact --no-banner --no-color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install detect-secrets==1.5.0
      - name: Baseline-aware scan
        run: |
          detect-secrets scan --no-verify \
            --exclude-files '\.secrets\.baseline$' \
            --exclude-files 'package-lock\.json$' \
            --exclude-files '\.(png|jpe?g|webp|ico|woff2?|ttf)$' \
            --exclude-files 'node_modules|frontend/dist|frontend/test-results|frontend/playwright-report|backend-rust/target|\.local-snapshots|(^|/)\.run/' \
            > .secrets-results.json
          python scripts/compare_secrets.py

  container-scan:
    name: Container security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend-rust/Dockerfile
            context: backend-rust
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
          - name: nginx
            dockerfile: nginx/Dockerfile
            context: nginx
          - name: postgres
            dockerfile: infra/postgres/Dockerfile
            context: .
          - name: redis
            dockerfile: infra/redis/Dockerfile
            context: infra/redis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t uasspain-${{ matrix.name }}:scan -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uasspain-${{ matrix.name }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: false
