# =============================================================================
# UASSPAIN — nginx edge (único punto de entrada público)
# - TLS 1.2/1.3 con certificados de la PKI interna (secrets en /run/secrets)
# - HTTP 8080 -> HTTPS 8443 (en host: 80 -> 8080, 443 -> 8443)
# - Host desconocido -> 444 (§7.7)
# - Proxy: /api/ y /ws/ -> backend | /media/ y resto -> frontend
# - non-root (USER nginx), logs a stdout/stderr (rotación vía Docker)
# =============================================================================
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ## Logs sin query-string (no registrar tokens/secretos §7.12)
    log_format edge '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout edge;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    autoindex off;

    ## Temp paths en /tmp (tmpfs 1777): /var/cache/nginx está montado con
    ## mode=755 root y el contenedor es read_only + USER nginx (sin DAC_OVERRIDE).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    # El binario oficial crea todos los directorios de módulos compilados al arrancar.
    scgi_temp_path /tmp/scgi_temp;

    ## Límites anti-abuso (§7.10)
    client_max_body_size 20m;
    large_client_header_buffers 4 16k;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;

    ## Proxy por defecto
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # The edge owns these headers; do not duplicate upstream values.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    ## TLS (§7.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    ## Rate limiting (§7.10)
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn_zone $binary_remote_addr zone=public_content_addr:10m;
    # HTTP/2 requests during panel startup must not consume the WS quota.
    # Keep the same per-IP socket limit in a dedicated counter.
    limit_conn_zone $binary_remote_addr zone=ws_addr:10m;
    # Twenty chat rooms with both peers behind one IP. Chat sockets must not
    # consume the general API/WS quota; each IP/room remains bounded to two.
    limit_conn_zone $binary_remote_addr zone=chat_addr:10m;
    limit_conn_zone "$binary_remote_addr:$uri" zone=chat_room:10m;
    # Presence and call signalling coexist for the seven-user cohort. Bound
    # video independently, with two sockets per call entry behind one IP.
    limit_conn_zone $binary_remote_addr zone=video_addr:10m;
    limit_conn_zone "$binary_remote_addr:$uri" zone=video_room:10m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_status 429;

    ## Allowlist de Host (§7.7)
    map $host $allowed_host {
        default 0;
        include /etc/nginx/allowed_hosts.conf;
    }

    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream frontend_s {
        zone frontend_s 64k;
        server frontend:8443 resolve;
    }

    upstream backend_s {
        zone backend_s 64k;
        server backend:8000 resolve;
    }

    ## El edge autentica el certificado interno del backend (TLS para API y WS).
    proxy_ssl_trusted_certificate /run/secrets/backend_tls_ca;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name backend;

    ## ─── HTTP: redirigir todo a HTTPS (§7.3) ────────────────────────────
    server {
        listen 8080 default_server;
        server_name _;
        access_log /dev/stdout edge;
        if ($allowed_host = 0) { return 444; }
        return 301 https://$host$request_uri;
    }

    ## ─── HTTPS: servidor único ──────────────────────────────────────────
    server {
        listen 8443 ssl default_server;
        server_name _;
        http2 on;

        ssl_certificate /run/secrets/edge_tls_cert;
        ssl_certificate_key /run/secrets/edge_tls_key;

        ## Hosts desconocidos -> cierre sin respuesta
        if ($allowed_host = 0) {
            return 444;
        }

        ## Cabeceras globales (§7.6) — los upstreams añaden CSP/Permissions-Policy
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        ## Healthcheck del propio edge (§21)
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            return 200 "ok\n";
        }

        ## Readiness agregada del backend (PostgreSQL + Redis)
        location = /readyz {
            proxy_pass https://backend_s/api/health/ready/;
            include /etc/nginx/proxy_params;
        }

        # The edge hides upstream Referrer-Policy and owns the final header.
        # Keep the OAuth callback stricter than ordinary public pages, and
        # repeat the global protections because add_header changes inheritance.
        location = /auth/google/callback {
            access_log off;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            proxy_pass https://frontend_s;
            proxy_ssl_name frontend;
            include /etc/nginx/proxy_params;
        }

        ## ─── Archivos sensibles: nunca (§7.11) ──────────────────────────
        location ~ /\.(?!well-known) {
            return 404;
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:env|key|pem|bak|sql|dump|log|sh|enc|gz)$ {
            return 404;
            access_log off;
            log_not_found off;
        }

        location ~* ^/(?:Dockerfile|docker-compose|compose)(?:\.[^/]*)?$ {
            return 404;
            access_log off;
            log_not_found off;
        }

        ## ─── WebSocket (§7.9) ───────────────────────────────────────────
        location /ws/chat/ {
            limit_req zone=ws burst=10 nodelay;
            limit_conn chat_addr 40;
            limit_conn chat_room 2;
            proxy_pass https://backend_s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /ws/public-content/ {
            limit_req zone=ws burst=10 nodelay;
            limit_conn public_content_addr 20;
            proxy_pass https://backend_s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/videollamada/ {
            limit_req zone=ws burst=10 nodelay;
            limit_conn video_addr 14;
            limit_conn video_room 2;
            proxy_pass https://backend_s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/ {
            limit_req zone=ws burst=10 nodelay;
            limit_conn ws_addr 10;
            proxy_pass https://backend_s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        ## ─── API (autenticación con rate-limit específico) ──────────────
        location ~ ^/api/auth/(?:login|google(?:/challenge)?|register|verify-otp|resend-otp|password-reset(?:/confirm)?)/$ {
            limit_req zone=auth burst=30 nodelay;
            limit_conn addr 20;
            proxy_pass https://backend_s;
            include /etc/nginx/proxy_params;
        }

        location /api/auth/ {
            limit_req zone=api burst=60 nodelay;
            limit_conn addr 20;
            proxy_pass https://backend_s;
            include /etc/nginx/proxy_params;
        }

        location /api/uploads/ {
            limit_req zone=upload burst=5 nodelay;
            limit_conn addr 5;
            proxy_pass https://backend_s;
            include /etc/nginx/proxy_params;
        }

        location = /api/contact/ {
            limit_req zone=contact burst=5 nodelay;
            limit_conn addr 5;
            proxy_pass https://backend_s;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_conn addr 50;
            proxy_pass https://backend_s;
            include /etc/nginx/proxy_params;
        }

        ## ─── Media (sirve el contenedor frontend, volume solo lectura) ──
        location ^~ /media/uploads/ {
            return 404;
        }

        location /media/ {
            proxy_pass https://frontend_s;
            proxy_ssl_name frontend;
            include /etc/nginx/proxy_params;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        ## ─── SPA + assets (contenedor frontend) ─────────────────────────
        location = /sitemap-courses.xml {
            proxy_pass https://backend_s/api/public/seo/sitemap-courses.xml;
            include /etc/nginx/proxy_params;
        }

        location = /_course-check {
            internal;
            proxy_pass https://backend_s/api/public/seo/course-route/$course_slug;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_intercept_errors on;
            error_page 404 = @missing_course;
            include /etc/nginx/proxy_params;
        }

        location @missing_course { return 403; }

        location = /_course-head {
            internal;
            proxy_pass https://backend_s/api/public/seo/course-head/$arg_slug;
            include /etc/nginx/proxy_params;
        }

        location = /_course-body {
            internal;
            proxy_pass https://backend_s/api/public/seo/course-body/$arg_slug;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/formacion/(?<course_slug>(?:(?:easa|no-easa|instructor)/)?[^/]+)/?$ {
            auth_request /_course-check;
            error_page 403 =404 /404.html;
            ssi on;
            rewrite ^ /course.html break;
            proxy_pass https://frontend_s;
            proxy_ssl_name frontend;
            # SSI must receive plain HTML; the edge can compress the final response.
            proxy_set_header Accept-Encoding "";
            include /etc/nginx/proxy_params;
        }

        location = /sitemap-services.xml {
            proxy_pass https://backend_s/api/public/seo/sitemap-services.xml;
            include /etc/nginx/proxy_params;
        }

        location = /_service-check {
            internal;
            proxy_pass https://backend_s/api/public/seo/service-route/$service_slug;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_intercept_errors on;
            error_page 404 = @missing_service;
            include /etc/nginx/proxy_params;
        }

        location @missing_service { return 403; }

        location = /_service-head {
            internal;
            proxy_pass https://backend_s/api/public/seo/service-head/$arg_slug;
            include /etc/nginx/proxy_params;
        }

        location = /_service-body {
            internal;
            proxy_pass https://backend_s/api/public/seo/service-body/$arg_slug;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/servicios/(?<service_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
            auth_request /_service-check;
            error_page 403 =404 /404.html;
            ssi on;
            rewrite ^ /service.html break;
            proxy_pass https://frontend_s;
            proxy_ssl_name frontend;
            # SSI must receive plain HTML; the edge can compress the final response.
            proxy_set_header Accept-Encoding "";
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass https://frontend_s;
            proxy_ssl_name frontend;
            include /etc/nginx/proxy_params;
        }
    }
}
