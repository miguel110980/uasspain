# Same production build and security headers, served through HTTPS.
# The socket limits reproduce nginx/nginx.conf; no production API is proxied.
user root root;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format test '$request_method $uri $status';
    access_log /dev/stdout test;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn_zone $binary_remote_addr zone=public_content_addr:10m;
    limit_conn_zone $binary_remote_addr zone=chat_addr:10m;
    limit_conn_zone "$binary_remote_addr:$uri" zone=chat_room:10m;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;
    limit_conn_status 429;
    limit_req_status 429;
    server {
        listen 8443 ssl;
        ssl_certificate /run/test-tls/cert;
        ssl_certificate_key /run/test-tls/key;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control no-store always;
        location /api/ {
            proxy_pass http://backend-e2e:8000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
        }
        location /media/ {
            alias /media_data/;
            include /etc/nginx/security-headers.conf;
        }
        location /ws/chat/ {
            limit_conn chat_addr 40;
            limit_conn chat_room 2;
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://backend-e2e:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_read_timeout 300s;
        }
        # Production gives public content its own connection budget. Counting
        # it as a private socket falsely rejects four users plus a group call.
        location = /ws/public-content/ {
            limit_conn public_content_addr 20;
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://backend-e2e:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_read_timeout 300s;
        }
        location /ws/ {
            limit_conn addr 10;
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://backend-e2e:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_read_timeout 300s;
        }
        location = /auth/google/callback {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            try_files /app.html =404;
        }
        location ~ ^/(admin|instructor|alumno|elegir-panel|restablecer-contrasena)/?$ {
            try_files /app.html =404;
        }
        # This fixture audits SPA layout and chat, not the edge's SSI SEO.
        location / { try_files $uri/index.html $uri /app.html; }
    }
}
