[package]
name = "uasspain-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Miguel Ángel González Pelegrina"]
license = "Proprietary"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["builder", "ring", "smtp-transport", "tokio1-rustls-tls", "webpki-roots"] }
lopdf = "0.45"
pbkdf2 = "0.12"
quick-xml = "0.42"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "1.7", default-features = false, features = ["aio", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "macros", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

