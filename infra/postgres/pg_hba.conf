# pg_hba endurecido (§10): SSL obligatorio para toda conexión TCP,
# por USUARIO de aplicación (mantiene flujos de mantenimiento: CREATE DATABASE
# para tests/restore-test siguen exigiendo TLS + scram), resto rechazado.
# El socket local solo existe dentro del contenedor (healthcheck/init).

# TYPE    DATABASE      USER        ADDRESS     METHOD
local     all           all                     trust
hostssl   all           uasspain_app        all         scram-sha-256
hostssl   all           uasspain_migrator   all         scram-sha-256
hostssl   all           uasspain_backup     all         scram-sha-256
hostssl   all           uasspain_restore    all         scram-sha-256
hostssl   all           uasspain_monitor    all         scram-sha-256
hostssl   all           all         all         reject
