# =============================================================================
# UASSPAIN — Log Rotation Configuration
# =============================================================================
# Install: sudo cp infra/monitoring/logrotate-uasspain.conf /etc/logrotate.d/uasspain

/var/log/uasspain/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 uasspain uasspain
    sharedscripts
    postrotate
        # Reload rsyslog if running
        if command -v systemctl > /dev/null 2>&1; then
            systemctl reload rsyslog > /dev/null 2>&1 || true
        fi
    endscript
}

/opt/uasspain/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
}

# Docker container logs
/var/lib/docker/containers/*/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    maxsize 50M
}
