# HTTPS production-build fixture; always layer over docker-compose.e2e.yml.
# Every API/WebSocket request goes to backend-e2e and its temporary database.
services:
  backend-e2e:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:8010,http://127.0.0.1:8010,http://127.0.0.1:8011,https://localhost:8444
  web-realtime-e2e:
    image: uasspain-e2e-media:local
    depends_on:
      backend-e2e:
        condition: service_healthy
    entrypoint: [nginx]
    command: [-c, /etc/nginx/realtime-e2e.conf, -g, 'daemon off;']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - ./scripts/e2e/realtime-nginx.conf:/etc/nginx/realtime-e2e.conf:ro
      - e2e_media:/media_data:ro
      - ./.secrets/tls/edge.crt:/run/test-tls/cert:ro
      - ./.secrets/tls/edge.key:/run/test-tls/key:ro
    ports: ['127.0.0.1:8444:8443']
    networks: [e2e_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --no-check-certificate, 'https://127.0.0.1:8443/']
      interval: 3s
      timeout: 3s
      retries: 20
