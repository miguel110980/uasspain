worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1M;
    large_client_header_buffers 4 16k;

    ## Temp paths en /tmp (tmpfs 1777): /var/cache/nginx montado mode=755 root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    # El binario oficial crea todos los directorios de módulos compilados al arrancar.
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;

    # Do not persist recovery tokens in query strings or Referer headers.
    log_format frontend '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';
    access_log /dev/stdout frontend;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    map $arg_auth $auth_robots { "" ""; default "noindex, nofollow"; }

    # ─── Rate limiting ────────────────────────────────────────
    # El backend aplica sus controles de abuso; aquí limitamos conexiones.

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/frontend-tls/server.crt;
        ssl_certificate_key /run/frontend-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:FRONTEND_TLS:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag $auth_robots always;


        # ─── API reverse proxy ───────────────────────────────────
        # ─── WebSocket proxy ─────────────────────────────────────
        # ─── Security headers (frontend only) ───────────────────
        # Se aplican en las rutas de frontend para no duplicar las del API.

        # ─── Cache control ────────────────────────────────────────
        location /assets/ {
            root /var/lib/frontend-static;
            try_files $uri =404;
            error_page 404 = @missing_asset;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location @missing_asset {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            types { }
            default_type text/plain;
            return 404 "Asset not found\n";
        }

        location = /tecnología {
            absolute_redirect off;
            return 308 /tecnologia$is_args$args;
        }

        location /images/ {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        location /fonts/ {
            expires 7d;
            add_header Cache-Control "public";
            include /etc/nginx/security-headers.conf;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/images/icon.webp;
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # ─── Media uploads (volume media_data, solo lectura) ─────
        location /media/ {
            alias /media_data/;
            expires 7d;
            add_header Cache-Control "public";
            include /etc/nginx/security-headers.conf;
        }

        location = /auth/google/callback {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files /app.html =404;
        }

        location / {
            try_files $uri/index.html $uri =404;
        }

        error_page 404 /404.html;

        location ~ ^/(admin|instructor|alumno|elegir-panel|restablecer-contrasena)/?$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files /app.html =404;
        }

        # Keep redirects relative to the public origin, including behind the edge proxy.
        location ~ ^/servicios/?$ {
            absolute_redirect off;
            return 301 /#servicios;
        }

        location ~ ^/(app|404)\.html$ {
            add_header Cache-Control "no-store, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # ─── Block dotfiles ───────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block common attack vectors ──────────────────────────
        location ~* \.(env|git|htaccess|htpasswd|ini|log|bak|sql)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
