worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1M;
    large_client_header_buffers 4 16k;

    ## Temp paths en /tmp (tmpfs 1777): /var/cache/nginx montado mode=755 root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    # El binario oficial crea todos los directorios de módulos compilados al arrancar.
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ─── Rate limiting ────────────────────────────────────────
    # El backend aplica sus controles de abuso; aquí limitamos conexiones.

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/frontend-tls/server.crt;
        ssl_certificate_key /run/frontend-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:FRONTEND_TLS:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;

        # ─── API reverse proxy ───────────────────────────────────
        # ─── WebSocket proxy ─────────────────────────────────────
        # ─── Security headers (frontend only) ───────────────────
        # Se aplican en las rutas de frontend para no duplicar las del API.

        # ─── Cache control ────────────────────────────────────────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        location /images/ {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/images/logo.png;
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── Media uploads (volume media_data, solo lectura) ─────
        location /media/ {
            alias /media_data/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com https://maps.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://maps.googleapis.com https://maps.gstatic.com; frame-src https://accounts.google.com https://maps.google.com https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://meet.jit.si https://*.meet.jit.si; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        }

        # ─── Block dotfiles ───────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block common attack vectors ──────────────────────────
        location ~* \.(env|git|htaccess|htpasswd|ini|log|bak|sql)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
